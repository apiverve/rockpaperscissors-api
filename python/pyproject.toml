[project]
name = "apiverve-rockpaperscissors"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Rock Paper Scissors API simulates the classic hand game with detailed outcome analysis, statistics, and support for multiple rounds."
keywords = ["rock paper scissors", "rps game", "game api", "random choice", "game simulator"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/rockpaperscissors?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/rockpaperscissors?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/rockpaperscissors-api"
Twitter = "https://twitter.com/apivervehq"
